<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- anel principal, centro transparente para a foto de perfil -->
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="86" stroke="url(#ring)" stroke-width="6"/>
    <circle cx="100" cy="100" r="79" stroke="#7c2d12" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="92" stroke="#fde68a" stroke-opacity="0.55" stroke-width="1"/>
  </g>
  <!-- asas laterais (Flame Wingman) -->
  <g filter="url(#glow)" fill="url(#wing)" stroke="#7c2d12" stroke-width="1.2" stroke-linejoin="round">
    <path d="M16 100 C2 84 4 56 20 40 C18 56 26 66 34 72 C24 74 20 84 24 92 C22 94 18 96 16 100 Z"/>
    <path d="M14 108 C0 108 -4 128 10 142 C10 132 18 128 26 128 C20 122 22 114 30 110 Z"/>
    <path d="M184 100 C198 84 196 56 180 40 C182 56 174 66 166 72 C176 74 180 84 176 92 C178 94 182 96 184 100 Z"/>
    <path d="M186 108 C200 108 204 128 190 142 C190 132 182 128 174 128 C180 122 178 114 170 110 Z"/>
  </g>
  <!-- chama no topo -->
  <g filter="url(#glow)">
    <path d="M100 2 C108 12 112 18 108 26 C106 20 102 18 100 14 C98 18 94 20 92 26 C88 18 92 12 100 2 Z" fill="#fde047" stroke="#c2410c" stroke-width="1.2"/>
    <path d="M100 10 C103 16 104 20 102 24 C101 21 100 20 100 18 C100 20 99 21 98 24 C96 20 97 16 100 10 Z" fill="#ef4444"/>
  </g>
  <!-- gema embaixo -->
  <g filter="url(#glow)">
    <path d="M100 186 L110 196 L100 206 L90 196 Z" transform="translate(0,-14)" fill="#38bdf8" stroke="#fde68a" stroke-width="1.5"/>
  </g>
</svg>
