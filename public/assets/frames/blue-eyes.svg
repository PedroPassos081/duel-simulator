<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- branco-azulado das escamas do Blue-Eyes White Dragon -->
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.6" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- anel de gelo; centro transparente para a foto de perfil -->
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="86" stroke="url(#ice)" stroke-width="6"/>
    <circle cx="100" cy="100" r="79" stroke="#1e3a8a" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="100" cy="100" r="92" stroke="#bae6fd" stroke-opacity="0.6" stroke-width="1"/>
  </g>
  <!-- asas do dragão (pontas afiadas) dos dois lados, abrindo para cima -->
  <g filter="url(#glow)" fill="url(#wing)" stroke="#1e3a8a" stroke-width="1.1" stroke-linejoin="round">
    <path d="M22 96 L4 70 L14 72 L2 46 L16 52 L10 26 L28 44 L30 66 C26 74 24 84 22 96 Z"/>
    <path d="M178 96 L196 70 L186 72 L198 46 L184 52 L190 26 L172 44 L170 66 C174 74 176 84 178 96 Z"/>
  </g>
  <!-- olho azul do dragão no topo -->
  <g filter="url(#glow)" stroke="#0c4a6e" stroke-width="1.2">
    <path d="M78 12 Q100 -2 122 12 Q100 26 78 12 Z" fill="#f8fafc"/>
    <circle cx="100" cy="12" r="6.5" fill="url(#eye)"/>
    <path d="M100 6 L100 18" stroke="#0b1d3a" stroke-width="1.8"/>
  </g>
  <!-- garras embaixo -->
  <g fill="url(#wing)" stroke="#1e3a8a" stroke-width="1">
    <path d="M86 186 L90 199 L94 186 Z"/>
    <path d="M97 187 L100 200 L103 187 Z"/>
    <path d="M106 186 L110 199 L114 186 Z"/>
  </g>
</svg>
