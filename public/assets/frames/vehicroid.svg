<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- anel de aço azul, como a lataria dos Vehicroids -->
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- engrenagem: dentes em volta do anel -->
  <g filter="url(#glow)" fill="url(#steel)" stroke="#0c4a6e" stroke-width="1">
    <g id="tooth"><rect x="95" y="4" width="10" height="11" rx="2"/></g>
    <use href="#tooth" transform="rotate(30 100 100)"/>
    <use href="#tooth" transform="rotate(60 100 100)"/>
    <use href="#tooth" transform="rotate(90 100 100)"/>
    <use href="#tooth" transform="rotate(120 100 100)"/>
    <use href="#tooth" transform="rotate(150 100 100)"/>
    <use href="#tooth" transform="rotate(180 100 100)"/>
    <use href="#tooth" transform="rotate(210 100 100)"/>
    <use href="#tooth" transform="rotate(240 100 100)"/>
    <use href="#tooth" transform="rotate(270 100 100)"/>
    <use href="#tooth" transform="rotate(300 100 100)"/>
    <use href="#tooth" transform="rotate(330 100 100)"/>
  </g>
  <!-- anel principal, centro transparente para a foto de perfil -->
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="86" stroke="url(#steel)" stroke-width="7"/>
    <circle cx="100" cy="100" r="79" stroke="#0c4a6e" stroke-opacity="0.9" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="86" stroke="url(#gold)" stroke-width="1.2" stroke-dasharray="6 5"/>
  </g>
  <!-- rodas e parafusos -->
  <g stroke="#0c4a6e" stroke-width="1.2">
    <circle cx="22" cy="170" r="11" fill="#1e293b"/>
    <circle cx="22" cy="170" r="5" fill="url(#gold)"/>
    <circle cx="178" cy="170" r="11" fill="#1e293b"/>
    <circle cx="178" cy="170" r="5" fill="url(#gold)"/>
  </g>
  <g fill="url(#gold)" stroke="#713f12" stroke-width="0.6">
    <circle cx="100" cy="182" r="3.2"/>
    <circle cx="18" cy="100" r="3.2"/>
    <circle cx="182" cy="100" r="3.2"/>
  </g>
</svg>
